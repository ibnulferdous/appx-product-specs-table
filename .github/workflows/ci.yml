name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

# A newer push to the same branch/PR cancels the in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck · Lint · Format · Test · Build
    runs-on: ubuntu-latest

    env:
      # Prisma resolves these from the schema's env() calls. No real database is
      # contacted: generate / typecheck / build / tests never open a connection
      # (the unit suite mocks Prisma). Dummy values keep the steps deterministic.
      DATABASE_URL: postgresql://user:pass@localhost:5432/db
      DIRECT_URL: postgresql://user:pass@localhost:5432/db

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          # Matches the local toolchain (engines: ">=22.12"). To also validate the
          # supported floor, turn this into a matrix incl. "20.19.0".
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Unit tests
        run: npm run test:run

      - name: Build
        run: npm run build
