# Dependabot keeps dependencies and CI actions patched automatically.
# Security-relevant for an App Store app: surfaces vulnerable transitive deps
# (Shopify SDK, Prisma, React Router) as PRs rather than silent risk.
# Docs: https://docs.github.com/code-security/dependabot/dependabot-version-updates
version: 2
updates:
  # Application dependencies (npm)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      # Bundle routine minor/patch bumps into a single PR to cut review load
      # for a solo maintainer. Majors still arrive as individual PRs.
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Pinned to the v6 major by maintainer decision (2026-06-20). The minimatch
      # ReDoS fix only exists in the breaking v8 line; risk accepted because this
      # is dev-only lint tooling that never ships to production. v6.x patch/minor
      # bumps are still offered. Revisit alongside an ESLint config migration.
      - dependency-name: "@typescript-eslint/*"
        update-types:
          - "version-update:semver-major"

  # CI workflow action versions (actions/checkout, actions/setup-node, …)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
