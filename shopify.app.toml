# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "11731a3dd8c8c256a56ecd5af892ed56"
name = "AppX Product Specs Table"
application_url = "https://specs-app.hiappx.com"
embedded = true

[build]
# PRODUCTION config. false so a `shopify app dev` session can never rewrite the
# production application_url / redirect_urls. Daily development uses
# shopify.app.dev.toml (a separate app) where this is true. See launch checklist Phase 1.
automatically_update_urls_on_dev = false

[webhooks]
api_version = "2026-01"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  # Mandatory compliance webhooks — required of every public app (step 106).
  # `compliance_topics`, NOT `topics`: a compliance topic under `topics` fails
  # CLI validation. One block per uri, because a subscription carries a single
  # uri and each topic has its own handler route. The three uris below were read
  # out of the generated router, not assumed — a mid-word underscore is literal
  # to `flatRoutes` (verified in `.react-router/types/+routes.ts`).
  [[webhooks.subscriptions]]
  uri = "/webhooks/customers/data_request"
  compliance_topics = [ "customers/data_request" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/customers/redact"
  compliance_topics = [ "customers/redact" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/shop/redact"
  compliance_topics = [ "shop/redact" ]

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "write_metaobject_definitions,write_metaobjects,write_products"

[auth]
redirect_urls = [ "https://specs-app.hiappx.com/api/auth" ]

# 🚫 There is NO per-product `[product.metafields.app.spec_table]` definition, and
# adding one back is a design reversal, not a convenience. It shipped in feature 34
# as the product -> template pointer, was demoted to "bounded single-product
# override" by the feature 40/43 routing map, and was REMOVED 2026-08-04: nothing in
# `app/` ever wrote it (single-product assignments go into `routing.byProduct`), so
# it was a live storefront read path with no writer. Its deletion took every stored
# value with it. Assignment is delivered by `[shop.metafields.app.routing]` below
# and resolved entirely from that map (data-model.md §9).

# --- Appx spec table (storefront delivery) ---------------------------------
# App-owned metaobject holding a template's storefront-ready payload. Declared
# here (declarative/TOML) so it deploys to every install and is resolved on the
# storefront by handle — `metaobjects["$app:appx_spec_table"][handle]`, where the
# handle comes from the shop routing map. Supersedes the runtime
# `metaobjectDefinitionCreate` path (data-model.md §10). `storefront = public_read`
# keeps `rows`/`status` readable by the Theme App Extension in Liquid; fields
# mirror what `upsertSpecTableMetaobject` writes.
[metaobjects.app.appx_spec_table]
name = "Appx Spec Table"
description = "Storefront-ready copy of an Appx spec table template."

  [metaobjects.app.appx_spec_table.access]
  admin = "merchant_read"
  storefront = "public_read"

[metaobjects.app.appx_spec_table.fields.template_id]
name = "Template ID"
type = "single_line_text_field"

[metaobjects.app.appx_spec_table.fields.status]
name = "Status"
type = "single_line_text_field"

[metaobjects.app.appx_spec_table.fields.rows]
name = "Rows"
type = "json"

[metaobjects.app.appx_spec_table.fields.styling]
name = "Styling"
type = "json"

# Precomputed presentation for the storefront wrapper (feature 57 Step 7):
# `{ "classes": "...", "vars": "..." }`, derived server-side from the SAME
# `StylingValues` as `styling` above. Liquid prints both verbatim and contains no
# styling logic (data-model.md §10). ADDITIVE field — an entry synced before this
# deploy simply lacks it and renders exactly as it did before.
[metaobjects.app.appx_spec_table.fields.styling_css]
name = "Styling CSS"
type = "json"

[metaobjects.app.appx_spec_table.fields.updated_at]
name = "Updated At"
type = "single_line_text_field"

# --- Appx routing shard (storefront delivery — Option 2, feature 108) --------
# App-owned metaobject holding the PER-PRODUCT portion of the routing map for one
# bucket, keyed `product.id mod ROUTING_SHARD_COUNT` (1024). One shard per occupied
# bucket, handle `routing-shard-<k>`. This is the structural fix to the shared 128KB
# `$app:routing` budget (data-model.md §14): `byProduct` + `excluded` moved OUT of
# that one metafield and INTO these shards, so each bucket carries its own 128KB and
# a product page reads only its own shard. Resolved on the storefront by constructed
# handle — `metaobjects["$app:appx_routing_shard"]['routing-shard-' | append: k]`
# (proven pattern, same as appx_spec_table above). `storefront = public_read` makes
# the two json fields Liquid-readable in the Theme App Extension.
#   by_product : json  { "<bare product id>": "<template handle>" }  (explicit picks)
#   excluded   : json  { "<bare product id>": 1 }                    (carve-outs)
#   wire_version : version tag (text, matches status/updated_at above) — debug only;
#                  shards are always the current wire version (hard cutover, D7).
#                  Key must be >=2 chars (Shopify metaobject field-key rule), so this
#                  is `wire_version`, not `v` (the shop `$app:routing` json uses `v`).
# 🔴 ROUTING_SHARD_COUNT (the modulus) is the STORAGE FORMAT and can never change
# after launch — a change re-buckets every product. See feature 108 D4.
[metaobjects.app.appx_routing_shard]
name = "Appx Routing Shard"
description = "Per-bucket slice of the shop routing map (per-product assignments + carve-outs)."

  [metaobjects.app.appx_routing_shard.access]
  admin = "merchant_read"
  storefront = "public_read"

[metaobjects.app.appx_routing_shard.fields.by_product]
name = "By Product"
type = "json"

[metaobjects.app.appx_routing_shard.fields.excluded]
name = "Excluded"
type = "json"

[metaobjects.app.appx_routing_shard.fields.wire_version]
name = "Wire Version"
type = "single_line_text_field"

# Shop-level routing map (attribute -> template handle). One json metafield per
# shop, rebuilt from the ACTIVE disjoint ProductAssignment rows (data-model.md §9)
# by `app/shopify/routing.server.ts`. `storefront = public_read` makes it
# Liquid-readable in the Theme App Extension as
# `shop.metafields["$app"].routing.value` (json auto-parsed). Reserved namespace
# resolves to `$app` / key `routing` (feature 41).
[shop.metafields.app.routing]
type = "json"
name = "Appx Storefront Routing"
description = "Maps product attributes to the assigned Appx spec-table handle."

  [shop.metafields.app.routing.access]
  admin = "merchant_read"
  storefront = "public_read"
